services:
  app:
    build: .
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 5s
      timeout: 2s
      retries: 10

  selenium:
    image: selenium/standalone-chrome:4.35.0
    shm_size: 2gb
    ports:
      - "4444:4444"
      - "7900:7900"
